name: Source validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked source dependencies
        run: npm ci
      - name: Formula, waveform, viewer and platform contract tests
        run: npm run test:core
      - name: Check source types
        run: npm run typecheck
      - name: Build web and process engine
        run: npm run build
      - name: Check publication candidates
        run: npm run audit:source
      - name: Check public documentation links
        run: npm run check:docs
      - name: Python evidence and diagnostics unit tests
        working-directory: workers/eda
        run: python3 -m unittest test_job_evidence test_toolchain_diagnostics
