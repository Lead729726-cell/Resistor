name: Source validation
on:
  push:
    branches: [main, codex/resistor-edu, codex/resistor-indust]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tutorials:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked source dependencies
        run: npm ci
      - name: Prepare browser and checksum-pinned tutorial assets
        run: |
          npx playwright install --with-deps chromium
          node scripts/tutorial-library-media.mjs
      - name: Validate every lesson, formula practice, mobile UI and original video
        run: npm run test:learning
      - name: Verify distinct edition downloads and preserved common installer routes
        run: npm run test:download-editions
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked source dependencies
        run: npm ci
      - name: Formula, waveform, viewer and platform contract tests
        run: npm run test:core
      - name: Check source types
        run: npm run typecheck
      - name: Edition isolation and actual MCP identity
        run: npm run test:editions
      - name: Build both product editions
        run: npm run build:edu && npm run build:indust
      - name: Build web and process engine
        run: npm run build
      - name: Check publication candidates
        run: npm run audit:source
      - name: Check public documentation links
        run: npm run check:docs
      - name: Check oscillator source evidence and downloadable artifact bytes
        run: node --test tests/oscillator-downloads.test.mjs
      - name: Install pinned geometry authority for schematic hierarchy tests
        run: python3 -m pip install klayout==0.30.5
      - name: Python evidence, diagnostics and logic hierarchy unit tests
        working-directory: workers/eda
        run: python3 -m unittest test_job_evidence test_toolchain_diagnostics test_workspace_paths test_drawing test_logic_composition test_source_stimulus test_oscillator_projects test_chip_references test_duet_afe test_power_ivr test_research
      - name: Workspace metadata and detailed API compatibility
        run: python3 -m unittest discover -s tests -p test_project_index.py
      - name: Independent extraction, timing and LVS report auditors
        run: python3 -m unittest discover -s tests -p test_paper_signoff.py -v
      - name: Exact KLayout intent review and revision persistence
        run: |
          python3 -m pip install klayout==0.30.5
          python3 -B -m unittest discover -s workers/eda -p test_electrical_review.py
          MOS_WORKSPACE="$RUNNER_TEMP/selection-native" RESISTOR_EDITION=indust python3 -B tests/selection-native-test.py
          MOS_WORKSPACE="$RUNNER_TEMP/indust-review" RESISTOR_EDITION=indust python3 -B tests/industry-review-test.py
      - name: Native assistant conversation UI with labelled local provider fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          npx playwright install --with-deps chromium
          npm run test:assistant-chat
      - name: Lecture focus, native demos, notes and actual recorder byte playback in both editions
        run: |
          npm run test:lecture:ui
          LECTURE_QA_EDITION=edu npm run test:lecture:ui
